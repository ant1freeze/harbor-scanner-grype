# Tests the adapter, then builds the linux/amd64 image and publishes it to GitHub Container Registry:
#   ghcr.io/<owner>/harbor-scanner-grype:<branch>      e.g. feature-policy-mode
#   ghcr.io/<owner>/harbor-scanner-grype:sha-<commit>  every build
#   ghcr.io/<owner>/harbor-scanner-grype:<tag>         for git tags such as v1.2.0
#   ghcr.io/<owner>/harbor-scanner-grype:latest        builds of the default branch
# The build downloads a fresh vulnerability DB, so every image starts with a current one.
name: docker-image

on:
  push:
    branches: [main, feature/policy-mode]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      # The queue and store tests use this Redis; without it they are skipped.
      SCANNER_TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./... -race -count=1

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/harbor-scanner-grype
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # No layer cache on purpose: the Exploit-DB list and the vulnerability DB are downloaded
          # during the build and must be current in every image.
          no-cache: true
